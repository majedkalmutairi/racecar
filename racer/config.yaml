# Every tunable number in the project lives in this file, nowhere else.
# Sections are filled in as each part gets built.

sim:
  track: oval      # loads tracks/<track>.png and tracks/<track>.yaml
  fps: 60          # frames per second
  px_per_m: 100    # default pixels per metre; a track's yaml overrides it
  max_dt: 0.05     # longest physics step allowed, seconds
  crash_reset_s: 1.0  # how long the car flashes after a crash before going back to start
car:
  wheelbase_m: 0.33
  max_speed_mps: 8
  max_steer_rad: 0.4
  max_accel: 4
  max_brake: 8
  length_m: 0.55
  width_m: 0.3
  friction_decel: 1.0
  speed_kp: 3.0      # P gain: accel = speed_kp * (target speed - speed)
lidar:
  n_beams: 108       # beams per scan
  fov_rad: 4.71      # field of view, 270 deg, centred on the heading
  max_range_m: 12    # LD19 max range
  step_m: 0.02       # ray-march step; smaller than any wall (>= 0.1 m) so beams cannot tunnel
  draw_beams: true
explore:
  speed_mps: 0.8         # first-lap speed, never above 1 m/s (CLAUDE.md §9)
  steer_k: 0.6           # P gain: steer = steer_k * (left - right)
  side_beams: 5          # beams averaged around +90 and -90 deg
  front_slow_m: 1.5      # slow down when the front beam is shorter than this
  front_slow_factor: 0.5 # speed multiplier while slowed
laps:
  radius_m: 0.5          # a lap ends when the car re-enters this circle around the start
  min_lap_s: 3           # ...and at least this long after the last lap
  csv_path: logs/laps.csv
mapping:       # filled in later
plan:          # filled in later
race:          # filled in later
learning:      # filled in later
safety:        # filled in later
track_change:  # filled in later
