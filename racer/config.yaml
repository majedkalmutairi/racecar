# Every tunable number in the project lives in this file, nowhere else.

sim:
  track: oval         # loads tracks/<track>.png and tracks/<track>.yaml
  fps: 60
  px_per_m: 100       # default pixels per metre; a track's yaml overrides it
  max_dt: 0.05        # longest physics step allowed, seconds
  crash_reset_s: 1.0  # how long the car flashes after a crash before going back to start
  seed: 0             # lidar noise seed; --seed overrides
  swap_margin_m: 0.3  # a track swap waits until the new walls are at least this far from the car
car:
  wheelbase_m: 0.33
  max_speed_mps: 8
  max_reverse_mps: 0.5  # reverse is only used to back out of a dead end
  max_steer_rad: 0.4
  max_accel: 6         # brushless motor, m/s^2
  max_brake: 6         # ESC brake, below the grip so the car can still steer while braking
  grip_mps2: 8.0       # tyre grip (~0.8 g): past it the car slides wide instead of turning, and cannot brake as hard
  length_m: 0.55
  width_m: 0.3
  friction_decel: 1.0
  speed_kp: 8.0       # accel = speed_kp * (target speed - speed)
lidar:
  n_beams: 108
  fov_rad: 4.71       # 270 deg, centred on the heading
  max_range_m: 12     # LD19 max range
  step_m: 0.02        # ray-march step; smaller than any wall so beams cannot tunnel
  noise_m: 0.01       # gaussian range noise, 1 sigma
  draw_beams: true
explore:
  speed_mps: 0.8      # first-lap speed, never above 1 m/s
  steer_k: 0.6        # steer = steer_k * (left - right)
  side_beams: 5       # beams averaged around +side_angle and -side_angle
  side_angle_rad: 1.2 # +-69 deg: looking a bit ahead damps the weave (+-90 deg crashed)
  front_slow_m: 1.5   # slow down when the front beam is shorter than this
  front_slow_factor: 0.5
  avoid_fov_rad: 0.8  # beams within +-46 deg push the car away from near things
  avoid_m: 1.2        # ...when they are closer than this
  avoid_k: 0.6
laps:
  radius_m: 0.5       # a lap ends when the car re-enters this circle around the start
  min_lap_s: 3        # ...and at least this long after the last lap
  min_lap_m: 5        # ...and after driving at least this far (backing up near the start is not a lap)
  csv_path: logs/laps.csv
mapping:
  size_m: 20          # grid covers -10..+10 m in x and y
  res_m: 0.05         # one cell = 5 cm
  min_hits: 3         # a cell is a wall once this many beams ended in it
  map_dir: logs
plan:
  ds_m: 0.1           # spacing of centerline and racing-line points
  snap_search_m: 1.0  # how far sideways a path point may slide to reach the ridge
  snap_iters: 3
  center_smooth_iters: 10
  margin_m: 0.3       # racing line keeps this far from the wall: half the car plus more than the reflex margin
  wall_clear_m: 0.35  # the racing line never comes closer than this to any mapped wall or box: half the car + 0.2 m for tracking error
  smooth_iters: 200     # the simple smoothed line, only used without a map
  smooth_alpha: 0.3
  mincurv_step_m: 0.3   # minimum-curvature line: one free offset every this many metres...
  mincurv_iters: 3      # ...solved this many times around its own result
  mincurv_length_w: 0.1 # weight on length against bending (0 = pure minimum curvature)
  mincurv_buffer_m: 0.05  # extra room kept, because the line cuts a little closer between solver points
  a_lat_max: 6.0      # corner grip the plan assumes, m/s^2: v = sqrt(a_lat_max * R); learning finds the rest
  a_brake: 6.0
  a_accel: 6.0
  kappa_eps: 1.0e-3   # straight = curvature below this
  curv_span_m: 0.6    # the speed profile reads curvature over this length of line
  replan_cells: 5     # this many new wall cells away from the known walls while racing = new obstacle, replan
  replan_cooldown_s: 3.0
race:
  ld_k: 0.4           # lookahead = ld_k * speed, clipped to [ld_min, ld_max]
  ld_min_m: 0.5
  ld_max_m: 2.0
  search_window: 30   # nearest-point search looks this many points ahead of the last match
  speed_lead_s: 0.12  # command the planned speed this far ahead in time (the speed controller's lag, ~1/speed_kp)
  cut_max_m: 0.10     # in bends the lookahead shrinks so pure pursuit cuts the corner by at most this...
  ld_floor_m: 0.3     # ...but never below this
  trust_err_m: 0.2    # the reflex trusts the plan while the car is this close to the line...
  trust_heading_rad: 0.4  # ...and pointing along it
  trust_horizon_m: 1.0    # line checked this far beyond the stopping distance
learning:
  n_sections: 60
  start_mult: 0.6     # first race lap runs at 60 % of the speed profile
  up: 0.05            # clean section: multiplier * (1 + up * clean laps in a row)...
  up_max: 0.15        # ...but never more than this in one lap
  down: 0.10          # problem section: multiplier * (1 - down), and its old value becomes a ceiling
  down_crash: 0.25    # ...a crash backs off harder
  below_ceiling: 0.98 # a section climbs back to this fraction of its ceiling...
  probe_laps: 2       # ...and after this many clean laps in a row
  probe: 0.06         # the ceiling is raised this much to try again
  min_mult: 0.2
  max_mult: 2.5       # no real cap: grip and tracking error decide
  err_ok_m: 0.12      # lateral error above this marks the section as a problem...
  settle_s: 1.5       # ...except for this long after a new plan or a reset, while the car gets onto the line
safety:
  ttc_s: 0.6            # slow down when the predicted path hits something sooner than this
  fov_deg: 180          # only beams within +-90 deg can be on the path ahead
  body_margin_m: 0.1    # a hit counts if it is within this of the shape the car body sweeps
  v_min_mps: 0.05       # speed floor in the ttc division, so a stopped car still reacts to contact
  hold_s: 0.5           # stay in charge this long after the last trigger
  escape_clear_m: 0.8   # the controller gets the car back once its path is free for this far
  stop_clear_m: 0.4     # below this much room in the escape direction the car stops entirely
  escape_speed_mps: 1.0 # never faster than this while off the plan
  brake_speed_mps: 0.0
  gap_range_m: 1.5      # beams longer than this count as open when looking for the widest gap
  bubble_m: 0.4         # beams this close to the nearest hit are blanked before the gap search
  steer_options: 17     # steering angles tried when no gap is open at all
  events_csv: logs/events.csv
slip:                   # the car turns less than its steering asks for = the tyres are sliding
  ratio: 0.95           # measured yaw rate below this fraction of v * tan(steer) / wheelbase...
  min_rate: 0.5         # ...when that is at least this many rad/s...
  min_v_mps: 1.0        # ...and the car is moving at least this fast
  lift: 0.9             # while sliding, the target speed is at most this fraction of the current speed
recovery:
  stuck_s: 1.0          # wanting to drive but not moving for this long = stuck
  stuck_v_mps: 0.05
  want_v_mps: 0.1       # ...where "wanting to drive" means the controller asks for more than this
  reverse_mps: 0.4
  back_m: 0.5           # first back-up; every further try at the same spot goes back_step_m further
  back_step_m: 0.25
  max_attempts: 3
  spot_m: 0.5           # tries within this distance of each other count as the same spot
  clear_m: 2.0          # ...until the car gets this far away from it
  grace_s: 1.5          # after a back-up the controller gets this long before stuck is judged again
  rear_beam_m: 0.2      # the outermost beams (+-135 deg) seeing something this close stops the back-up
  rear_check_m: 0.1     # the body is checked against the map this far along the reverse arc
  map_margin_m: 0.05
  no_progress_s: 30     # not getting progress_m away from a point for this long = give up
  progress_m: 1.0
track_change:
  threshold: 0.35     # fraction of beams that miss the map
  hold_s: 2.0         # ...for this long before the map is thrown away
  cell_tol: 2         # a beam "hits the map" if a wall cell is within this many cells
obstacles:            # known boxes per track: [x, y, w, h] in metres, used with --obstacles
  # each one >= 2.5 m from the start and leaves >= 0.85 m to the other wall
  oval: [[5.0, 5.35, 0.3, 0.3]]
  hairpin: [[0.3, 3.35, 0.3, 0.3]]
  chicane: [[0.25, 3.35, 0.3, 0.3]]
  twisty: [[9.3, 3.4, 0.3, 0.3]]
  snake: [[0.4, 3.5, 0.3, 0.3]]
trackgen:             # random tracks: racer/sim/trackgen.py makes them, racer/sim/trackcheck.py rejects bad ones
  sizes: {small: [8, 6], medium: [10, 7], large: [10, 10]}   # metres; the map grid only covers 10 x 10
  border_m: 0.3         # wall kept around the image edge
  min_radius_m: 1.0     # tightest centreline corner (the car turns no tighter than 0.78 m)
  wall_gap_m: 0.2       # wall left between two passes of the corridor
  start_clear_m: 1.0    # no other part of the loop this close to the start (lap counter)
  lap_m: [10, 40]
  straight_kappa: 0.05  # curvature below this counts as straight
  slalom_kappa: 0.5     # a slalom may sit on a bend gentler than this (radius > 2 m)
  max_tries: 300
  arc_frac: 0.5         # a corner arc may use up to this much of each side (0.5 = arcs may meet)
  box_m: [0.3, 0.3]     # box size range, along x first
  box_m_max: [0.5, 0.3]
  box_start_clear_m: 2.5  # no box this close to the start along the track
  box_spacing_m: 2.0    # boxes at least this far apart along the track
  box_corner_radius_m: 1.2  # no box on a corner tighter than this
  slalom_spacing_m: [1.8, 2.5]
  slalom_drop: false    # true: slalom boxes appear mid-race instead of being there from the start
  drop_from_lap: 3      # first dropped box appears after this many laps, then one per lap
  drop_clear_m: 1.5     # a dropped box waits until the car is at least this far away
  drop_mismatch_max: 0.25  # dropped boxes may hide at most this fraction of the beams (change detector: 0.35)
  line_radius_factor: 1.2  # the planned line must be this much rounder than the car's tightest turn
  line_clear_m: 0.25    # planned line at least this far from any wall or box (half the car + reflex margin)
  difficulty:           # star = a few big sweeping corners; grid = the outline of a random blob of cells
                        # reach = how far out toward the edge a star corner goes; cell_m = distance between
                        # neighbouring passes, cells = fraction of the grid in the blob
    easy:   {shape: star, corners: [4, 5], reach: [0.75, 1.0], radius_m: [1.8, 2.5], width_m: [1.5, 1.5],
             known: [1, 1], drop: [1, 1], slalom: [2, 2], gap_m: 1.0}
    medium: {shape: star, corners: [5, 7], reach: [0.55, 1.0], radius_m: [1.2, 1.8], width_m: [1.3, 1.5],
             known: [1, 2], drop: [1, 1], slalom: [2, 3], gap_m: 0.9}
    hard:   {shape: grid, cell_m: [2.2, 2.6], cells: [0.6, 0.9], jitter: 0.1, radius_m: [1.0, 1.2],
             width_m: [1.2, 1.3], known: [1, 3], drop: [1, 2], slalom: [2, 3], gap_m: 0.85}
dashboard:
  panel_w: 400
  corner_kappa: 0.3   # a section with a bend tighter than 1 / this (3.3 m radius) counts as a corner
  graph_len: 200
